# Tells Grafana to load dashboard JSON files from ./json (mounted alongside this file in Phase 7).
apiVersion: 1

providers:
  - name: AgentCore
    orgId: 1
    folder: AgentCore
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
