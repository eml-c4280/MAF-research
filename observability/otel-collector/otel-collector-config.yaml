# Receives OTLP traces + logs from AgentCore.Api and fans them out to Tempo/Loki.
# Metrics bypass this collector entirely - the API exposes /metrics directly for Prometheus
# to scrape (see docs/plan.md section 8 for why).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/loki, debug]
